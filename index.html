<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão para Motoristas</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: #0f172a;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* NAV TABS */
    .tabs {
      display: flex;
      background-color: var(--card-bg);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
    }

    /* CONTEÚDO DAS ABAS */
    .tab-content {
      display: none;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .tab-content.active {
      display: block;
    }

    h3 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    h4 {
      font-size: 0.95rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    /* FORMULÁRIOS */
    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    button.submit-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    button.submit-btn:hover {
      background-color: var(--primary-hover);
    }

    /* CARDS DE DESEMPENHO */
    .section-block {
      margin-bottom: 20px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .kpi-card {
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 10px;
    }

    .kpi-card .title {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .kpi-card .value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 4px;
    }

    .kpi-card.highlight .value {
      color: var(--success);
    }

    /* ALUGUEL & ALERTAS */
    .rent-section {
      display: none;
      background-color: rgba(15, 23, 42, 0.5);
      border-left: 3px solid var(--primary);
      padding: 12px;
      border-radius: 0 8px 8px 0;
      margin-top: 12px;
      margin-bottom: 12px;
    }

    .alert {
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-top: 14px;
      line-height: 1.4;
    }

    .alert-warning {
      background-color: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--warning);
      color: #fcd34d;
    }

    .alert-danger {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(event, 'diario')">Lançamento</button>
    <button class="tab-btn" onclick="switchTab(event, 'desempenho')">Desempenho</button>
    <button class="tab-btn" onclick="switchTab(event, 'carro')">Meu Carro</button>
  </div>

  <!-- ABA LANÇAMENTO DIÁRIO -->
  <div id="diario" class="tab-content active">
    <h3>Lançamento Diário</h3>
    <form id="form-diario">
      <div class="form-group">
        <label for="data">Data</label>
        <input type="date" id="data" required>
      </div>
      <div class="form-group">
        <label for="ganho-bruto">Ganho Bruto (R$)</label>
        <input type="number" id="ganho-bruto" step="0.01" placeholder="0,00" required>
      </div>
      <div class="form-group">
        <label for="corridas">Quantidade de Corridas</label>
        <input type="number" id="corridas" placeholder="0" required>
      </div>
      <div class="form-group">
        <label for="km">KM Rodados</label>
        <input type="number" id="km" step="0.1" placeholder="0.0" required>
      </div>
      <div class="form-group">
        <label for="horas">Horas Trabalhadas</label>
        <input type="number" id="horas" step="0.1" placeholder="0.0" required>
      </div>
      <div class="form-group">
        <label for="combustivel">Gasto com Combustível/Recarga (R$)</label>
        <input type="number" id="combustivel" step="0.01" value="0">
      </div>
      <div class="form-group">
        <label for="outros-custos">Outros Custos Extras (R$)</label>
        <input type="number" id="outros-custos" step="0.01" value="0">
      </div>
      <button type="submit" class="submit-btn">Salvar Dia</button>
    </form>
  </div>

  <!-- ABA DESEMPENHO -->
  <div id="desempenho" class="tab-content">
    <h3>Métricas de Desempenho</h3>
    
    <div class="section-block">
      <h4>Esta Semana</h4>
      <div class="kpi-grid">
        <div class="kpi-card highlight"><div class="title">Ganho Líquido</div><div class="value" id="sem-liquido">R$ 0,00</div></div>
        <div class="kpi-card"><div class="title">Média / Corrida</div><div class="value" id="sem-media-corrida">R$ 0,00</div></div>
        <div class="kpi-card"><div class="title">Ganho / KM</div><div class="value" id="sem-ganho-km">R$ 0,00</div></div>
        <div class="kpi-card"><div class="title">Ganho / Hora</div><div class="value" id="sem-ganho-hora">R$ 0,00</div></div>
      </div>
    </div>

    <div class="section-block">
      <h4>Este Mês</h4>
      <div class="kpi-grid">
        <div class="kpi-card highlight"><div class="title">Ganho Líquido</div><div class="value" id="mes-liquido">R$ 0,00</div></div>
        <div class="kpi-card"><div class="title">Média / Corrida</div><div class="value" id="mes-media-corrida">R$ 0,00</div></div>
        <div class="kpi-card"><div class="title">Ganho / KM</div><div class="value" id="mes-ganho-km">R$ 0,00</div></div>
        <div class="kpi-card"><div class="title">Ganho / Hora</div><div class="value" id="mes-ganho-hora">R$ 0,00</div></div>
      </div>
    </div>
  </div>

  <!-- ABA MEU CARRO -->
  <div id="carro" class="tab-content">
    <h3>Configurações do Veículo</h3>
    <form id="form-carro">
      <div class="form-group">
        <label for="tipo-veiculo">Tipo de Posse</label>
        <select id="tipo-veiculo" onchange="toggleAluguel()">
          <option value="proprio">Carro Próprio</option>
          <option value="alugado">Carro Alugado</option>
        </select>
      </div>

      <div id="secao-aluguel" class="rent-section">
        <div class="form-group">
          <label for="aluguel-semanal">Valor do Aluguel Semanal (R$)</label>
          <input type="number" id="aluguel-semanal" step="0.01" value="0">
        </div>
        <div class="form-group">
          <label for="limite-km-semanal">Limite de KM Semanal (Locadora)</label>
          <input type="number" id="limite-km-semanal" value="0">
        </div>
      </div>

      <button type="submit" class="submit-btn">Salvar Configurações</button>
    </form>

    <div id="status-aluguel-km"></div>
  </div>
</div>

<script>
  let registros = JSON.parse(localStorage.getItem('registros_motorista')) || [];
  let configCarro = JSON.parse(localStorage.getItem('config_carro')) || {
    tipo: 'proprio',
    aluguelSemanal: 0,
    limiteKmSemanal: 0
  };

  document.getElementById('data').valueAsDate = new Date();

  function switchTab(e, tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    e.currentTarget.classList.add('active');
    document.getElementById(tabId).classList.add('active');

    if (tabId === 'desempenho') calcularDesempenho();
  }

  function toggleAluguel() {
    const tipo = document.getElementById('tipo-veiculo').value;
    const secao = document.getElementById('secao-aluguel');
    secao.style.display = tipo === 'alugado' ? 'block' : 'none';
  }

  document.getElementById('form-carro').addEventListener('submit', (e) => {
    e.preventDefault();
    configCarro = {
      tipo: document.getElementById('tipo-veiculo').value,
      aluguelSemanal: parseFloat(document.getElementById('aluguel-semanal').value) || 0,
      limiteKmSemanal: parseFloat(document.getElementById('limite-km-semanal').value) || 0
    };
    localStorage.setItem('config_carro', JSON.stringify(configCarro));
    alert('Configurações salvas!');
    atualizarStatusAluguel();
  });

  document.getElementById('form-diario').addEventListener('submit', (e) => {
    e.preventDefault();
    const novoRegistro = {
      data: document.getElementById('data').value,
      bruto: parseFloat(document.getElementById('ganho-bruto').value),
      corridas: parseInt(document.getElementById('corridas').value),
      km: parseFloat(document.getElementById('km').value),
      horas: parseFloat(document.getElementById('horas').value),
      combustivel: parseFloat(document.getElementById('combustivel').value) || 0,
      outrosCustos: parseFloat(document.getElementById('outros-custos').value) || 0
    };

    registros.push(novoRegistro);
    localStorage.setItem('registros_motorista', JSON.stringify(registros));
    alert('Dia registrado com sucesso!');
    e.target.reset();
    document.getElementById('data').valueAsDate = new Date();
  });

  function calcularDesempenho() {
    const hoje = new Date();
    const custoDiarioAluguel = configCarro.tipo === 'alugado' ? (configCarro.aluguelSemanal / 7) : 0;

    const dadosSemana = registros.filter(r => isMesmaSemana(new Date(r.data), hoje));
    const dadosMes = registros.filter(r => isMesmoMes(new Date(r.data), hoje));

    renderMetricas('sem', dadosSemana, custoDiarioAluguel);
    renderMetricas('mes', dadosMes, custoDiarioAluguel);
    atualizarStatusAluguel();
  }

  function renderMetricas(prefixo, lista, custoDiarioAluguel) {
    const totalBruto = lista.reduce((acc, r) => acc + r.bruto, 0);
    const totalCorridas = lista.reduce((acc, r) => acc + r.corridas, 0);
    const totalKm = lista.reduce((acc, r) => acc + r.km, 0);
    const totalHoras = lista.reduce((acc, r) => acc + r.horas, 0);
    const totalVariavel = lista.reduce((acc, r) => acc + r.combustivel + r.outrosCustos, 0);
    
    const totalAluguel = lista.length * custoDiarioAluguel;
    const liquido = totalBruto - totalVariavel - totalAluguel;

    document.getElementById(`${prefixo}-liquido`).innerText = formatarMoeda(liquido);
    document.getElementById(`${prefixo}-media-corrida`).innerText = formatarMoeda(totalCorridas ? totalBruto / totalCorridas : 0);
    document.getElementById(`${prefixo}-ganho-km`).innerText = formatarMoeda(totalKm ? totalBruto / totalKm : 0);
    document.getElementById(`${prefixo}-ganho-hora`).innerText = formatarMoeda(totalHoras ? totalBruto / totalHoras : 0);
  }

  function atualizarStatusAluguel() {
    const statusDiv = document.getElementById('status-aluguel-km');
    if (configCarro.tipo !== 'alugado') {
      statusDiv.innerHTML = '';
      return;
    }

    const hoje = new Date();
    const dadosSemana = registros.filter(r => isMesmaSemana(new Date(r.data), hoje));
    const kmRodadosSemana = dadosSemana.reduce((acc, r) => acc + r.km, 0);
    const limite = configCarro.limiteKmSemanal;

    if (limite > 0) {
      const perc = (kmRodadosSemana / limite) * 100;
      let classeAlert = 'alert-warning';
      if (perc >= 100) classeAlert = 'alert-danger';

      statusDiv.innerHTML = `
        <div class="alert ${classeAlert}">
          <strong>Uso de KM na Semana:</strong> ${kmRodadosSemana.toFixed(1)} / ${limite} km (${perc.toFixed(1)}%)
          ${perc >= 100 ? '<br>⚠️ Você ultrapassou o limite de KM contratado!' : ''}
        </div>
      `;
    }
  }

  function isMesmoMes(d1, d2) {
    return d1.getMonth() === d2.getMonth() && d1.getFullYear() === d2.getFullYear();
  }

  function isMesmaSemana(d1, d2) {
    const inicioSemana = new Date(d2);
    inicioSemana.setDate(d2.getDate() - d2.getDay());
    const fimSemana = new Date(inicioSemana);
    fimSemana.setDate(inicioSemana.getDate() + 6);
    return d1 >= inicioSemana && d1 <= fimSemana;
  }

  function formatarMoeda(valor) {
    return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  document.getElementById('tipo-veiculo').value = configCarro.tipo;
  document.getElementById('aluguel-semanal').value = configCarro.aluguelSemanal;
  document.getElementById('limite-km-semanal').value = configCarro.limiteKmSemanal;
  toggleAluguel();
</script>
</body>
</html>
